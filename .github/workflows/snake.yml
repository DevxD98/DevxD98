name: Generate profile graphics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/retro-snake-dark.svg?color_snake=#e8d5b5&color_dots=#161616,#3a211a,#6e4231,#b86f4b,#e8d5b5
            dist/retro-snake-light.svg?color_snake=#8f5146&color_dots=#ebe7e0,#e2c9ad,#c79a5b,#b86f4b,#8f5146

      - name: Render activity graph
        run: |
          mkdir -p dist
          node .github/scripts/activity-graph.mjs "${{ github.repository_owner }}" dist/activity-graph.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
